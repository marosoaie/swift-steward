name: PR checks

on:
  pull_request:

# Read-only token for both jobs: annotations are workflow commands in the
# log, and actions/cache authenticates with its own runtime token.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests-and-diagnostics:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # reach the merge base

      - name: Select newest Xcode (Swift 6.2+ required)
        run: |
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      # Same tree for diff and build, so line numbers can't drift.
      - name: Diff against base
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/pr.diff

      - uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/git-diff-parser-tests
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}

      - name: Build (capture compiler diagnostics)
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee /tmp/build.log

      - name: Run tests
        run: swift test --skip-build

      - name: SwiftLint
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          which swiftlint || brew install swiftlint
          swiftlint lint --quiet | tee /tmp/swiftlint.log

      # Annotate diagnostics on PR-touched lines; fail on new warnings there.
      - name: Fail on new warnings in changed lines
        if: always()
        run: |
          touch /tmp/build.log /tmp/swiftlint.log
          status=0
          .build/debug/steward filter /tmp/build.log \
            --diff /tmp/pr.diff \
            --tool xcodebuild \
            --format github \
            --fail-on warning || status=1
          .build/debug/steward filter /tmp/swiftlint.log \
            --diff /tmp/pr.diff \
            --tool swiftlint \
            --format github \
            --fail-on warning || status=1
          exit $status
  # Not a required check. The "Command line output" suite pins outputs taken
  # from the macOS build, so a pass here means Linux prints the same bytes.
  linux-tests:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    steps:
      # Before checkout, so actions/checkout makes a real clone. The numstat
      # oracle needs git, and the kernel fixture is .xz, which the image
      # can't decompress without xz-utils.
      - name: Install git and xz
        run: |
          if ! command -v git >/dev/null || ! command -v xz >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends git xz-utils
          fi
          git --version
          xz --version | head -1
          swift --version

      - uses: actions/checkout@v7

      # The fixture cache falls back to $HOME/.cache, and actions/cache
      # expands ~ from the same HOME inside the container. .build stays
      # uncached: the swift:6.2 tag moves across patch releases, and a key
      # without the compiler would restore stale modules.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/git-diff-parser-tests
          key: fixtures-${{ runner.os }}

      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test --skip-build
