name: PR checks

on:
  pull_request:

# Read-only token for every job but tests-and-diagnostics, whose Steward
# step posts the summary comment: annotations are workflow commands in the
# log, and actions/cache authenticates with its own runtime token.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests-and-diagnostics:
    runs-on: macos-26
    timeout-minutes: 30
    # Steward creates, updates and deletes its summary comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # reach the merge base; the Actions-run suite needs it too

      - name: Select newest Xcode (Swift 6.2+ required)
        run: |
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}

      # Keyed on what it holds, as in linux-tests.
      - name: Restore the fixture cache
        id: fixture-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/git-diff-parser-tests
          key: fixtures-${{ runner.os }}-newest
          restore-keys: fixtures-${{ runner.os }}-

      - name: Build (capture compiler diagnostics)
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee build.log

      - name: Run tests
        run: swift test --skip-build

      - name: Key the fixture cache on its contents
        id: fixture-key
        run: |
          cd ~/Library/Caches/git-diff-parser-tests || exit 0
          hash=$(find . -type f -exec stat -f '%N %z' {} + | LC_ALL=C sort | shasum -a 256 | cut -c1-16)
          echo "key=fixtures-${{ runner.os }}-$hash" >> "$GITHUB_OUTPUT"

      - name: Save the fixture cache
        if: steps.fixture-key.outputs.key != '' && steps.fixture-key.outputs.key != steps.fixture-cache.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/git-diff-parser-tests
          key: ${{ steps.fixture-key.outputs.key }}

      - name: SwiftLint
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          which swiftlint || brew install swiftlint
          swiftlint lint --quiet | tee swiftlint.log

      # This repository's own Dangerfile/, which depends on this checkout, so
      # the pull request is checked by its own Steward. Its diagnostics rule
      # reads the two logs above, maps them from the merge commit to the
      # head, and fails on warnings on changed lines, as the `steward filter`
      # step it replaced did. Pinned to a commit until steward-action tags v1.
      - name: Steward
        if: ${{ !cancelled() }}
        uses: marosoaie/steward-action@c606a4a637221b3d86c35e18c71aa4bbf6d9fecb

      - name: Test the Dangerfile's rules
        if: ${{ !cancelled() }}
        run: swift test --package-path Dangerfile
  # Not a required check. The "Command line output" suite pins outputs taken
  # from the macOS build, so a pass here means Linux prints the same bytes.
  linux-tests:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    steps:
      # Before checkout, so actions/checkout makes a real clone. The numstat
      # oracle needs git, and the kernel fixture is .xz, which the image
      # can't decompress without xz-utils.
      - name: Install git and xz
        run: |
          if ! command -v git >/dev/null || ! command -v xz >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends git xz-utils
          fi
          git --version
          xz --version | head -1
          swift --version

      - uses: actions/checkout@v7

      # The fixture cache is keyed on what it holds: after the tests, on a
      # hash of its files' names and sizes. A run that downloads a fixture
      # saves a new cache, which the next run restores, and a run that
      # downloads nothing saves nothing. (A fixed key never saves again
      # once it hits, and a hash of the test sources would miss fixtures
      # named in any other file and save again on every test change.) No
      # cache has the key `newest`, so the restore takes the newest that
      # `restore-keys` starts. The fixtures fall back to $HOME/.cache, and
      # the cache actions expand ~ from the same HOME inside the container.
      # .build stays uncached: the swift:6.2 tag moves across patch
      # releases, and a key without the compiler would restore stale
      # modules.
      - name: Restore the fixture cache
        id: fixture-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/git-diff-parser-tests
          key: fixtures-${{ runner.os }}-newest
          restore-keys: fixtures-${{ runner.os }}-

      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      # The container runs as root on a checkout the runner owns, and the
      # Actions-run suite reads that checkout with git: it must find the
      # depth-1 history too shallow, not be refused the repository.
      - name: Run tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          swift test --skip-build

      - name: Key the fixture cache on its contents
        id: fixture-key
        run: |
          cd ~/.cache/git-diff-parser-tests || exit 0
          hash=$(find . -type f -printf '%P %s\n' | LC_ALL=C sort | sha256sum | cut -c1-16)
          echo "key=fixtures-${{ runner.os }}-$hash" >> "$GITHUB_OUTPUT"

      - name: Save the fixture cache
        if: steps.fixture-key.outputs.key != '' && steps.fixture-key.outputs.key != steps.fixture-cache.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/git-diff-parser-tests
          key: ${{ steps.fixture-key.outputs.key }}

  # Not required checks. The template Dangerfile package users copy
  # (docs/quickstart.md), as a copy beside the checkout would be built, but
  # with its swift-steward dependency pointed at this checkout: the
  # template names main, which doesn't have this pull request's changes
  # yet. Then a dry run on the pull request, which may find what the
  # example rules look for (status 1), but must run (not status 2 or a
  # crash).
  dangerfile-template:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the dry run's merge base

      - name: Select newest Xcode (Swift 6.2+ required)
        run: |
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      - name: Copy the template
        run: Templates/copy-dangerfile.sh "$RUNNER_TEMP/Dangerfile"

      - name: Build
        run: swift build --package-path "$RUNNER_TEMP/Dangerfile" --build-tests

      - name: Test
        run: swift test --package-path "$RUNNER_TEMP/Dangerfile" --skip-build

      # The built executable, not swift run, so a SwiftPM error can't pass
      # for status 1.
      - name: Dry run
        run: |
          bin=$(swift build --package-path "$RUNNER_TEMP/Dangerfile" --show-bin-path)
          status=0
          env -u GITHUB_ACTIONS "$bin/Dangerfile" --base "origin/${{ github.base_ref }}" || status=$?
          echo "The Dangerfile exited with status $status."
          test "$status" -le 1

  dangerfile-template-linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Copy the template
        run: Templates/copy-dangerfile.sh "$RUNNER_TEMP/Dangerfile"

      - name: Build
        run: swift build --package-path "$RUNNER_TEMP/Dangerfile" --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --package-path "$RUNNER_TEMP/Dangerfile" --skip-build

      # The checkout belongs to the runner's user, not the container's root,
      # as the quickstart's workflow without the Action says.
      - name: Dry run
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bin=$(swift build --package-path "$RUNNER_TEMP/Dangerfile" --show-bin-path)
          status=0
          env -u GITHUB_ACTIONS "$bin/Dangerfile" --base "origin/${{ github.base_ref }}" || status=$?
          echo "The Dangerfile exited with status $status."
          test "$status" -le 1
