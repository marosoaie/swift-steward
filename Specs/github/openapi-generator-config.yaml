# swift-openapi-generator config for Sources/GitHubAPI, used by both the
# `filter` and `generate` steps of Tooling/generate-github-api.sh.
generate:
  - types
  - client
# Internal, not package: with `package`, every generated file imports
# OpenAPIRuntime as `package import`, and the files that declare nothing warn
# that the import is unused. Generated types never appear in public API.
accessModifier: internal
namingStrategy: idiomatic
# Under the generator's do-not-modify line in every file. The generated
# doc comments are GitHub's descriptions, so each file points at GitHub's
# licence, which MIT asks copies to carry.
additionalFileComments:
  - "From Specs/github/openapi.yaml, a filtered copy of GitHub's REST API"
  - "description: MIT License, Copyright (c) 2020 GitHub; see Specs/github/LICENSE."
# The operations Steward v1 calls. `filter` keeps only these and the
# components they reach.
filter:
  operations:
    - issues/list-comments
    - issues/create-comment
    - issues/update-comment
    - issues/delete-comment
    - pulls/get
