components:
  schemas:
    simple-user:
      type: object
      title: Simple User
      description: A GitHub user.
      properties:
        name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        login:
          type: string
          examples:
          - octocat
        id:
          type: integer
          format: int64
          examples:
          - 1
        node_id:
          type: string
          examples:
          - MDQ6VXNlcjE=
        avatar_url:
          type: string
          format: uri
          examples:
          - https://github.com/images/error/octocat_happy.gif
        gravatar_id:
          type:
          - string
          - 'null'
          examples:
          - 41d064eb2195891e12d0413f63227ea7
        url:
          type: string
          format: uri
          examples:
          - https://api.github.com/users/octocat
        html_url:
          type: string
          format: uri
          examples:
          - https://github.com/octocat
        followers_url:
          type: string
          format: uri
          examples:
          - https://api.github.com/users/octocat/followers
        following_url:
          type: string
          examples:
          - https://api.github.com/users/octocat/following{/other_user}
        gists_url:
          type: string
          examples:
          - https://api.github.com/users/octocat/gists{/gist_id}
        starred_url:
          type: string
          examples:
          - https://api.github.com/users/octocat/starred{/owner}{/repo}
        subscriptions_url:
          type: string
          format: uri
          examples:
          - https://api.github.com/users/octocat/subscriptions
        organizations_url:
          type: string
          format: uri
          examples:
          - https://api.github.com/users/octocat/orgs
        repos_url:
          type: string
          format: uri
          examples:
          - https://api.github.com/users/octocat/repos
        events_url:
          type: string
          examples:
          - https://api.github.com/users/octocat/events{/privacy}
        received_events_url:
          type: string
          format: uri
          examples:
          - https://api.github.com/users/octocat/received_events
        type:
          type: string
          examples:
          - User
        site_admin:
          type: boolean
        starred_at:
          type: string
          examples:
          - '"2020-07-09T00:17:55Z"'
        user_view_type:
          type: string
          examples:
          - public
      required:
      - login
      - id
      - node_id
      - avatar_url
      - gravatar_id
      - url
      - html_url
      - followers_url
      - following_url
      - gists_url
      - starred_url
      - subscriptions_url
      - organizations_url
      - repos_url
      - events_url
      - received_events_url
      - type
      - site_admin
      minProperties: 18
    basic-error:
      type: object
      title: Basic Error
      description: Basic Error
      properties:
        message:
          type: string
        documentation_url:
          type: string
        url:
          type: string
        status:
          type: string
      minProperties: 0
    enterprise:
      type: object
      title: Enterprise
      description: An enterprise on GitHub.
      properties:
        description:
          type:
          - string
          - 'null'
          description: A short description of the enterprise.
        html_url:
          type: string
          format: uri
          examples:
          - https://github.com/enterprises/octo-business
        website_url:
          type:
          - string
          - 'null'
          format: uri
          description: The enterprise's website URL.
        id:
          type: integer
          description: Unique identifier of the enterprise
          examples:
          - 42
        node_id:
          type: string
          examples:
          - MDEwOlJlcG9zaXRvcnkxMjk2MjY5
        name:
          type: string
          description: The name of the enterprise.
          examples:
          - Octo Business
        slug:
          type: string
          description: The slug url identifier for the enterprise.
          examples:
          - octo-business
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          examples:
          - '2019-01-26T19:01:12Z'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          examples:
          - '2019-01-26T19:14:43Z'
        avatar_url:
          type: string
          format: uri
      required:
      - html_url
      - id
      - node_id
      - name
      - slug
      - created_at
      - updated_at
      - avatar_url
      minProperties: 8
    validation-error:
      type: object
      title: Validation Error
      description: Validation Error
      properties:
        message:
          type: string
        documentation_url:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              resource:
                type: string
              field:
                type: string
              message:
                type: string
              code:
                type: string
              index:
