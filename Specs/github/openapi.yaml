openapi: 3.1.0
info:
  title: GitHub v3 REST API
  description: GitHub's v3 REST API.
  termsOfService: https://docs.github.com/articles/github-terms-of-service
  contact:
    name: Support
    url: https://support.github.com/contact?tags=dotcom-rest-api
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT
  version: 1.1.4
  x-github-plan: api.github.com
externalDocs:
  description: GitHub v3 REST API
  url: https://docs.github.com/rest/
tags:
- name: actions
  description: Endpoints to manage GitHub Actions using the REST API.
- name: activity
  description: Activity APIs provide access to notifications, subscriptions, and timelines.
- name: apps
  description: Information for integrations and installations.
- name: billing
  description: Monitor charges and usage from Actions and Packages.
- name: checks
  description: Rich interactions with checks run by your integrations.
- name: code-scanning
  description: Retrieve code scanning alerts from a repository.
- name: codes-of-conduct
  description: Insight into codes of conduct for your communities.
- name: emojis
  description: List emojis available to use on GitHub.
- name: dependabot
  description: Endpoints to manage Dependabot.
- name: dependency-graph
  description: Endpoints to access Dependency Graph features.
- name: gists
  description: View, modify your gists.
- name: git
  description: Raw Git functionality.
- name: gitignore
  description: View gitignore templates
- name: issues
  description: Interact with GitHub Issues.
- name: licenses
  description: View various OSS licenses.
- name: markdown
  description: Render GitHub flavored Markdown
- name: merge-queue
  description: Interact with GitHub Merge Queues.
- name: meta
  description: Endpoints that give information about the API.
- name: migrations
  description: Move projects to or from GitHub.
- name: oidc
  description: Endpoints to manage GitHub OIDC configuration using the REST API.
- name: orgs
  description: Interact with organizations.
- name: packages
  description: Manage packages for authenticated users and organizations.
- name: pulls
  description: Interact with GitHub Pull Requests.
- name: rate-limit
  description: Check your current rate limit status.
- name: reactions
  description: Interact with reactions to various GitHub entities.
- name: repos
  description: Interact with GitHub Repos.
- name: search
  description: Search for specific items on GitHub.
- name: secret-scanning
  description: Retrieve secret scanning alerts from a repository.
- name: teams
  description: Interact with GitHub Teams.
- name: users
  description: Interact with and view information about users and also current user.
- name: code-quality
  description: Insights into reliability, maintainability, and efficiency of your
    codebase.
- name: codespaces
  description: Endpoints to manage Codespaces using the REST API.
- name: copilot
  description: Endpoints to manage Copilot using the REST API.
- name: copilot-spaces
  description: Endpoints to manage Copilot Spaces using the REST API.
- name: security-advisories
  description: Manage security advisories.
- name: interactions
  description: Owner or admin management of users interactions.
- name: classroom
  description: Interact with GitHub Classroom.
- name: desktop
  description: Desktop specific endpoints.
- name: code-security
  description: Endpoints to manage Code security using the REST API.
- name: private-registries
  description: Manage private registry configurations.
- name: hosted-compute
  description: Manage hosted compute networking resources.
- name: credentials
  description: Revoke compromised or leaked GitHub credentials.
- name: campaigns
  description: Endpoints to manage campaigns via the REST API.
- name: projects
  description: Endpoints to manage Projects using the REST API.
- name: agent-automations
  description: Endpoints to manage and interact with agent automations.
- name: agent-tasks
  description: Endpoints to manage and interact with agent tasks.
- name: agents
  description: Endpoints for Agents secrets and variables.
servers:
- url: https://api.github.com
paths:
  /repos/{owner}/{repo}/issues/comments/{comment_id}:
    delete:
      tags:
      - issues
      summary: Delete an issue comment
      description: You can use the REST API to delete comments on issues and pull
        requests. Every pull request is an issue, but not every issue is a pull request.
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/issues/comments#delete-an-issue-comment
      operationId: issues/delete-comment
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - $ref: '#/components/parameters/comment-id'
      responses:
        204:
          description: Response
        404:
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        subcategory: comments
        enabledForGitHubApps: true
        category: issues
    patch:
      tags:
      - issues
      summary: Update an issue comment
      description: 'You can use the REST API to update comments on issues and pull
        requests. Every pull request is an issue, but not every issue is a pull request.


        This endpoint supports the following custom media types. For more information,
        see "[Media types](https://docs.github.com/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types)."


        - **`application/vnd.github.raw+json`**: Returns the raw markdown body. Response
        will include `body`. This is the default if you do not pass any specific media
        type.

        - **`application/vnd.github.text+json`**: Returns a text only representation
        of the markdown body. Response will include `body_text`.

        - **`application/vnd.github.html+json`**: Returns HTML rendered from the body''s
        markdown. Response will include `body_html`.

        - **`application/vnd.github.full+json`**: Returns raw, text, and HTML representations.
        Response will include `body`, `body_text`, and `body_html`.'
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/issues/comments#update-an-issue-comment
      operationId: issues/update-comment
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - $ref: '#/components/parameters/comment-id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: The contents of the comment.
              required:
              - body
              minProperties: 1
            examples:
              default:
                value:
                  body: Me too
        required: true
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/issue-comment'
              examples:
                default:
                  $ref: '#/components/examples/issue-comment'
        422:
          $ref: '#/components/responses/validation_failed'
        404:
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        subcategory: comments
        enabledForGitHubApps: true
        category: issues
  /repos/{owner}/{repo}/issues/{issue_number}/comments:
    get:
      tags:
      - issues
      summary: List issue comments
      description: 'You can use the REST API to list comments on issues and pull requests.
        Every pull request is an issue, but not every issue is a pull request.


        Issue comments are ordered by ascending ID.


        This endpoint supports the following custom media types. For more information,
        see "[Media types](https://docs.github.com/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types)."


        - **`application/vnd.github.raw+json`**: Returns the raw markdown body. Response
        will include `body`. This is the default if you do not pass any specific media
        type.

        - **`application/vnd.github.text+json`**: Returns a text only representation
        of the markdown body. Response will include `body_text`.

        - **`application/vnd.github.html+json`**: Returns HTML rendered from the body''s
        markdown. Response will include `body_html`.

        - **`application/vnd.github.full+json`**: Returns raw, text, and HTML representations.
        Response will include `body`, `body_text`, and `body_html`.'
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/issues/comments#list-issue-comments
      operationId: issues/list-comments
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - $ref: '#/components/parameters/issue-number'
      - $ref: '#/components/parameters/since'
      - $ref: '#/components/parameters/per-page'
      - $ref: '#/components/parameters/page'
      responses:
        200:
          description: Response
          headers:
            Link:
              $ref: '#/components/headers/link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/issue-comment'
                minItems: 0
                uniqueItems: false
              examples:
                default:
                  $ref: '#/components/examples/issue-comment-items'
        404:
          $ref: '#/components/responses/not_found'
        410:
          $ref: '#/components/responses/gone'
      x-github:
        githubCloudOnly: false
        subcategory: comments
        enabledForGitHubApps: true
        category: issues
    post:
      tags:
      - issues
      summary: Create an issue comment
      description: 'You can use the REST API to create comments on issues and pull
        requests. Every pull request is an issue, but not every issue is a pull request.


        This endpoint triggers [notifications](https://docs.github.com/github/managing-subscriptions-and-notifications-on-github/about-notifications).

        Creating content too quickly using this endpoint may result in secondary rate
        limiting.

        For more information, see "[Rate limits for the API](https://docs.github.com/rest/using-the-rest-api/rate-limits-for-the-rest-api#about-secondary-rate-limits)"

        and "[Best practices for using the REST API](https://docs.github.com/rest/guides/best-practices-for-using-the-rest-api)."


        This endpoint supports the following custom media types. For more information,
        see "[Media types](https://docs.github.com/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types)."


        - **`application/vnd.github.raw+json`**: Returns the raw markdown body. Response
        will include `body`. This is the default if you do not pass any specific media
        type.

        - **`application/vnd.github.text+json`**: Returns a text only representation
        of the markdown body. Response will include `body_text`.

        - **`application/vnd.github.html+json`**: Returns HTML rendered from the body''s
        markdown. Response will include `body_html`.

        - **`application/vnd.github.full+json`**: Returns raw, text, and HTML representations.
        Response will include `body`, `body_text`, and `body_html`.'
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/issues/comments#create-an-issue-comment
      operationId: issues/create-comment
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - $ref: '#/components/parameters/issue-number'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: The contents of the comment.
              required:
              - body
              minProperties: 1
            examples:
              default:
                value:
                  body: Me too
        required: true
      responses:
        201:
          description: Response
          headers:
            Location:
              schema:
                type: string
              example: https://api.github.com/repos/octocat/Hello-World/issues/comments/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/issue-comment'
              examples:
                default:
                  $ref: '#/components/examples/issue-comment'
        403:
          $ref: '#/components/responses/forbidden'
        410:
          $ref: '#/components/responses/gone'
        422:
          $ref: '#/components/responses/validation_failed'
        404:
          $ref: '#/components/responses/not_found'
      x-github:
        triggersNotification: true
        githubCloudOnly: false
        subcategory: comments
        enabledForGitHubApps: true
        category: issues
  /repos/{owner}/{repo}/pulls/{pull_number}:
    get:
      tags:
      - pulls
      summary: Get a pull request
      description: 'Draft pull requests are available in public repositories with
        GitHub Free and GitHub Free for organizations, GitHub Pro, and legacy per-repository
        billing plans, and in public and private repositories with GitHub Team and
        GitHub Enterprise Cloud. For more information, see [GitHub''s products](https://docs.github.com/github/getting-started-with-github/githubs-products)
        in the GitHub Help documentation.


        Lists details of a pull request by providing its number.


        When you get, [create](https://docs.github.com/rest/pulls/pulls/#create-a-pull-request),
        or [edit](https://docs.github.com/rest/pulls/pulls#update-a-pull-request)
        a pull request, GitHub creates a merge commit to test whether the pull request
        can be automatically merged into the base branch. This test commit is not
        added to the base branch or the head branch. You can review the status of
        the test commit using the `mergeable` key. For more information, see "[Checking
        mergeability of pull requests](https://docs.github.com/rest/guides/getting-started-with-the-git-database-api#checking-mergeability-of-pull-requests)".


        The value of the `mergeable` attribute can be `true`, `false`, or `null`.
        If the value is `null`, then GitHub has started a background job to compute
        the mergeability. After giving the job time to complete, resubmit the request.
        When the job finishes, you will see a non-`null` value for the `mergeable`
        attribute in the response. If `mergeable` is `true`, then `merge_commit_sha`
        will be the SHA of the _test_ merge commit.


        The value of the `merge_commit_sha` attribute changes depending on the state
        of the pull request. Before merging a pull request, the `merge_commit_sha`
        attribute holds the SHA of the _test_ merge commit. After merging a pull request,
        the `merge_commit_sha` attribute changes depending on how you merged the pull
        request:


        *   If merged as a [merge commit](https://docs.github.com/articles/about-merge-methods-on-github/),
        `merge_commit_sha` represents the SHA of the merge commit.

        *   If merged via a [squash](https://docs.github.com/articles/about-merge-methods-on-github/#squashing-your-merge-commits),
        `merge_commit_sha` represents the SHA of the squashed commit on the base branch.

        *   If [rebased](https://docs.github.com/articles/about-merge-methods-on-github/#rebasing-and-merging-your-commits),
        `merge_commit_sha` represents the commit that the base branch was updated
        to.


        Pass the appropriate [media type](https://docs.github.com/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types)
        to fetch diff and patch formats.


        This endpoint supports the following custom media types. For more information,
        see "[Media types](https://docs.github.com/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types)."


        - **`application/vnd.github.raw+json`**: Returns the raw markdown body. Response
        will include `body`. This is the default if you do not pass any specific media
        type.

        - **`application/vnd.github.text+json`**: Returns a text only representation
        of the markdown body. Response will include `body_text`.

        - **`application/vnd.github.html+json`**: Returns HTML rendered from the body''s
        markdown. Response will include `body_html`.

        - **`application/vnd.github.full+json`**: Returns raw, text, and HTML representations.
        Response will include `body`, `body_text`, and `body_html`.

        - **`application/vnd.github.diff`**: For more information, see "[git-diff](https://git-scm.com/docs/git-diff)"
        in the Git documentation. If a diff is corrupt, contact us through the [GitHub
        Support portal](https://support.github.com/). Include the repository name
        and pull request ID in your message.'
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/pulls/pulls#get-a-pull-request
      operationId: pulls/get
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - $ref: '#/components/parameters/pull-number'
      responses:
        200:
          description: Pass the appropriate [media type](https://docs.github.com/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types)
            to fetch diff and patch formats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pull-request'
              examples:
                default:
                  $ref: '#/components/examples/pull-request'
        304:
          $ref: '#/components/responses/not_modified'
        404:
          $ref: '#/components/responses/not_found'
        406:
          $ref: '#/components/responses/unacceptable'
        422:
          $ref: '#/components/responses/validation_failed'
        500:
          $ref: '#/components/responses/internal_error'
        503:
          $ref: '#/components/responses/service_unavailable'
      x-github:
        githubCloudOnly: false
        subcategory: pulls
        enabledForGitHubApps: true
        category: pulls
components:
  schemas:
    simple-user:
      type: object
      title: Simple User
      description: A GitHub user.
      properties:
        name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        login:
          type: string
          examples:
          - octocat
        id:
          type: integer
          format: int64
          examples:
          - 1
        node_id:
          type: string
          examples:
          - MDQ6VXNlcjE=
        avatar_url:
          type: string
          format: uri
          examples:
          - https://github.com/images/error/octocat_happy.gif
        gravatar_id:
          type:
          - string
          - 'null'
          examples:
          - 41d064eb2195891e12d0413f63227ea7
        url:
          type: string
          format: uri
          examples:
          - https://api.github.com/users/octocat
        html_url:
          type: string
          format: uri
          examples:
          - https://github.com/octocat
        followers_url:
          type: string
          format: uri
          examples:
          - https://api.github.com/users/octocat/followers
        following_url:
          type: string
          examples:
          - https://api.github.com/users/octocat/following{/other_user}
        gists_url:
          type: string
          examples:
          - https://api.github.com/users/octocat/gists{/gist_id}
        starred_url:
          type: string
          examples:
          - https://api.github.com/users/octocat/starred{/owner}{/repo}
        subscriptions_url:
          type: string
          format: uri
          examples:
          - https://api.github.com/users/octocat/subscriptions
        organizations_url:
          type: string
          format: uri
          examples:
          - https://api.github.com/users/octocat/orgs
        repos_url:
          type: string
          format: uri
          examples:
          - https://api.github.com/users/octocat/repos
        events_url:
          type: string
          examples:
          - https://api.github.com/users/octocat/events{/privacy}
        received_events_url:
          type: string
          format: uri
          examples:
          - https://api.github.com/users/octocat/received_events
        type:
          type: string
          examples:
          - User
        site_admin:
          type: boolean
        starred_at:
          type: string
          examples:
          - '"2020-07-09T00:17:55Z"'
        user_view_type:
          type: string
          examples:
          - public
      required:
      - login
      - id
      - node_id
      - avatar_url
      - gravatar_id
      - url
      - html_url
      - followers_url
      - following_url
      - gists_url
      - starred_url
      - subscriptions_url
      - organizations_url
      - repos_url
      - events_url
      - received_events_url
      - type
      - site_admin
      minProperties: 18
    basic-error:
      type: object
      title: Basic Error
      description: Basic Error
      properties:
        message:
          type: string
        documentation_url:
          type: string
        url:
          type: string
        status:
          type: string
      minProperties: 0
    enterprise:
      type: object
      title: Enterprise
      description: An enterprise on GitHub.
      properties:
        description:
          type:
          - string
          - 'null'
          description: A short description of the enterprise.
        html_url:
          type: string
          format: uri
          examples:
          - https://github.com/enterprises/octo-business
        website_url:
          type:
          - string
          - 'null'
          format: uri
          description: The enterprise's website URL.
        id:
          type: integer
          description: Unique identifier of the enterprise
          examples:
          - 42
        node_id:
          type: string
          examples:
          - MDEwOlJlcG9zaXRvcnkxMjk2MjY5
        name:
          type: string
          description: The name of the enterprise.
          examples:
          - Octo Business
        slug:
          type: string
          description: The slug url identifier for the enterprise.
          examples:
          - octo-business
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          examples:
          - '2019-01-26T19:01:12Z'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          examples:
          - '2019-01-26T19:14:43Z'
        avatar_url:
          type: string
          format: uri
      required:
      - html_url
      - id
      - node_id
      - name
      - slug
      - created_at
      - updated_at
      - avatar_url
      minProperties: 8
    validation-error:
      type: object
      title: Validation Error
      description: Validation Error
      properties:
        message:
          type: string
        documentation_url:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              resource:
                type: string
              field:
                type: string
              message:
                type: string
              code:
                type: string
              index:
                type: integer
              value:
                oneOf:
                - type:
                  - string
                  - 'null'
                - type:
                  - integer
                  - 'null'
                - type:
                  - array
                  - 'null'
                  items:
                    type: string
                  minItems: 0
                  uniqueItems: false
                type: 'null'
            required:
            - code
            minProperties: 1
          minItems: 0
          uniqueItems: false
      required:
      - message
      - documentation_url
      minProperties: 2
